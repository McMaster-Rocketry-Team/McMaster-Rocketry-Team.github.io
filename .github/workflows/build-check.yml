name: Build check

# Manual only until the built site passes check:todo (no TODO strings in dist/).
# Do not add push/PR triggers back while placeholder content remains — see
# .cursor/rules/ci.mdc and scripts/check-todo.mjs.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm astro build
      - run: pnpm check:todo
