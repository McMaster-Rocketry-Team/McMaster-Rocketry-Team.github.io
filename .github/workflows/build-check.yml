name: Build check

# Sanity check for every push/PR that isn't the production deploy: does the
# Astro build still succeed? No TODO gate here (see deploy.yml) - dev is the
# working branch and is expected to carry placeholder content until launch.
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm astro build
